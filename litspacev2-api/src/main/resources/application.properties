spring.application.name=litspacev2-api

spring.datasource.url=jdbc:postgresql://localhost:5432/litspacev2_db
spring.datasource.username=gbarbosa
spring.datasource.password=gbarbosa-pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Configuração de Token JWT
api.security.token.secret=${JWT_SECRET:litspacev2-secret-key-dev-environment-123456}